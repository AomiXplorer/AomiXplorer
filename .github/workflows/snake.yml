name: generate snake

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 WIB tiap hari
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Rendyzzx
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push ke branch output
        run: |
          git config user.name "aomi-snake[bot]"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B output
          cp dist/* .
          git add github-contribution-grid-snake*.svg
          git commit -m "chore: regenerate snake" || echo "no changes"
          git push origin output
